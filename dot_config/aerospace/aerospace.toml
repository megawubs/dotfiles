# Omarchy-like AeroSpace config
# Super = Alt (Option)
# Place this file at:  ~/.aerospace.toml
# Install other files: 
#   mkdir -p ~/.config/aerospace
#   chmod +x ~/.config/aerospace/split-last.sh ~/.config/aerospace/bsp-watch.sh
# Then: aerospace reload-config

config-version = 2
start-at-login = true
auto-reload-config = true

after-login-command = []
after-startup-command = [
    'layout tiles --root',
    'exec-and-forget $HOME/.config/aerospace/bsp-watch.sh',
]

exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = []
on-mode-changed = []

automatically-unhide-macos-hidden-apps = true
focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '0']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = [{ monitor."built-in" = 3 }, 36]
outer.right = 8

[[on-window-detected]]
check-further-callbacks = true
run = 'layout tiling'

[mode.main.binding]
    cmd-h = []
    cmd-alt-h = []

    alt-enter = 'exec-and-forget kitty @ launch --type=os-window --cwd=current'
    alt-shift-enter = 'exec-and-forget open -a "Zen"'
    alt-space = 'exec-and-forget open -a Raycast'

    alt-shift-f = 'exec-and-forget open -a Finder'
    alt-shift-b = 'exec-and-forget open -a "Zen"'

    alt-w = 'close'
    alt-f = 'fullscreen'
    alt-j = 'exec-and-forget $HOME/.config/aerospace/omarchy-j.sh'
    alt-slash = 'layout tiles --root'

    alt-left  = 'focus left --boundaries all-monitors-outer-frame'
    alt-down  = 'focus down --boundaries all-monitors-outer-frame'
    alt-up    = 'focus up --boundaries all-monitors-outer-frame'
    alt-right = 'focus right --boundaries all-monitors-outer-frame'

    alt-shift-left  = 'move left --boundaries all-monitors-outer-frame'
    alt-shift-down  = 'move down --boundaries all-monitors-outer-frame'
    alt-shift-up    = 'move up --boundaries all-monitors-outer-frame'
    alt-shift-right = 'move right --boundaries all-monitors-outer-frame'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 0'

    alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window '
    alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
    alt-shift-0 = 'move-node-to-workspace 0 --focus-follows-window'

    alt-ctrl-shift-1 = 'move-node-to-workspace 1'
    alt-ctrl-shift-2 = 'move-node-to-workspace 2'
    alt-ctrl-shift-3 = 'move-node-to-workspace 3'
    alt-ctrl-shift-4 = 'move-node-to-workspace 4'
    alt-ctrl-shift-5 = 'move-node-to-workspace 5'
    alt-ctrl-shift-6 = 'move-node-to-workspace 6'
    alt-ctrl-shift-7 = 'move-node-to-workspace 7'
    alt-ctrl-shift-8 = 'move-node-to-workspace 8'
    alt-ctrl-shift-9 = 'move-node-to-workspace 9'
    alt-ctrl-shift-0 = 'move-node-to-workspace 0'

    alt-tab       = 'workspace next --wrap-around'
    alt-shift-tab = 'workspace prev --wrap-around'
    alt-ctrl-tab  = 'workspace-back-and-forth'

    alt-ctrl-shift-left  = 'move-workspace-to-monitor --wrap-around left'
    alt-ctrl-shift-right = 'move-workspace-to-monitor --wrap-around right'
    alt-ctrl-shift-up    = 'move-workspace-to-monitor --wrap-around up'
    alt-ctrl-shift-down  = 'move-workspace-to-monitor --wrap-around down'

    alt-ctrl-shift-h = 'move-workspace-to-monitor --wrap-around left'
    alt-ctrl-shift-l = 'move-workspace-to-monitor --wrap-around right'
    alt-ctrl-shift-k = 'move-workspace-to-monitor --wrap-around up'
    alt-ctrl-shift-j = 'move-workspace-to-monitor --wrap-around down'

    alt-esc = 'exec-and-forget pmset displaysleepnow'
    alt-shift-c = 'reload-config'

    alt-r = 'mode resize'
    alt-shift-semicolon = 'mode service'
    alt-shift-r = ['flatten-workspace-tree', 'layout tiles --root']

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    left  = 'resize width -50'
    down  = 'resize height +50'
    up    = 'resize height -50'
    right = 'resize width +50'
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    enter = 'mode main'
    esc   = 'mode main'

[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'layout tiles --root', 'mode main']
    t         = ['layout tiles --root', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']
    alt-shift-left = ['join-with left', 'mode main']
    alt-shift-right = ['join-with right', 'mode main']
    alt-shift-down = ['join-with down', 'mode main']
    alt-shift-up = ['join-with up', 'mode main']

[workspace-to-monitor-force-assignment]
  '1' = '^233V5'
  '2' = '^233V5'
  '3' = '^233V5'
  '4' = '^233V5'
  '5' = '^233V5'
  '6' = 'built-in'
  '7' = 'built-in'
  '8' = 'built-in'
  '9' = 'built-in'
  '0' = '^233V5'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id =  'com.1password.1password'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.flexibits.fantastical2.mac'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.jetbrains.PhpStorm'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'io.music-assistant.companion'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 0'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'move-node-to-workspace 0'

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = 'move-node-to-workspace 0'

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace 0'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 0'

