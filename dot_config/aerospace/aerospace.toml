# Omarchy-like AeroSpace config
# Super = Alt (Option)
# Place this file at:  ~/.aerospace.toml
# Install other files: 
#   mkdir -p ~/.config/aerospace
#   chmod +x ~/.config/aerospace/split-last.sh ~/.config/aerospace/bsp-watch.sh
# Then: aerospace reload-config

config-version = 2
start-at-login = true
auto-reload-config = true

after-login-command = []
after-startup-command = [
    'layout tiles --root',
    'exec-and-forget $HOME/.config/aerospace/bsp-watch.sh',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = []
on-mode-changed = []

automatically-unhide-macos-hidden-apps = true
focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

persistent-workspaces = ['1', '2', '3', '4', '5', 'S']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = [{ monitor."built-in" = 3 }, 36]
outer.right = 8

[[on-window-detected]]
check-further-callbacks = true
run = 'layout tiling'

[mode.main.binding]
    cmd-h = []
    cmd-alt-h = []

    alt-enter = 'exec-and-forget open -na Ghostty'
    alt-shift-enter = 'exec-and-forget open -a "Brave Browser"'
    alt-space = 'exec-and-forget open -a Raycast'

    alt-shift-f = 'exec-and-forget open -a Finder'
    alt-shift-b = 'exec-and-forget open -a "Brave Browser"'

    alt-w = 'close'
    alt-f = 'fullscreen'
    alt-j = 'exec-and-forget $HOME/.config/aerospace/omarchy-j.sh'
    alt-slash = 'layout tiles --root'

    alt-left  = 'focus left'
    alt-down  = 'focus down'
    alt-up    = 'focus up'
    alt-right = 'focus right'

    alt-shift-left  = 'move left'
    alt-shift-down  = 'move down'
    alt-shift-up    = 'move up'
    alt-shift-right = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'

    alt-ctrl-shift-1 = 'move-node-to-workspace 1'
    alt-ctrl-shift-2 = 'move-node-to-workspace 2'
    alt-ctrl-shift-3 = 'move-node-to-workspace 3'
    alt-ctrl-shift-4 = 'move-node-to-workspace 4'
    alt-ctrl-shift-5 = 'move-node-to-workspace 5'

    alt-tab       = 'workspace next --wrap-around'
    alt-shift-tab = 'workspace prev --wrap-around'
    alt-ctrl-tab  = 'workspace-back-and-forth'

    alt-ctrl-shift-left  = 'move-workspace-to-monitor --wrap-around left'
    alt-ctrl-shift-right = 'move-workspace-to-monitor --wrap-around right'
    alt-ctrl-shift-up    = 'move-workspace-to-monitor --wrap-around up'
    alt-ctrl-shift-down  = 'move-workspace-to-monitor --wrap-around down'

    alt-s      = 'workspace S'
    alt-ctrl-s = 'move-node-to-workspace S --focus-follows-window'

    alt-esc = 'exec-and-forget pmset displaysleepnow'
    alt-shift-c = 'reload-config'

    alt-r = 'mode resize'
    alt-shift-semicolon = 'mode service'
    alt-shift-r = ['flatten-workspace-tree', 'layout tiles --root']

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    left  = 'resize width -50'
    down  = 'resize height +50'
    up    = 'resize height -50'
    right = 'resize width +50'
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    enter = 'mode main'
    esc   = 'mode main'

[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'layout tiles --root', 'mode main']
    t         = ['layout tiles --root', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']
    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
