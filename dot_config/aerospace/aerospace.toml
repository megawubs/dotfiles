# Omarchy-like AeroSpace config
# Super = Alt (Option)
# Place this file at:  ~/.aerospace.toml
# Install other files: 
#   mkdir -p ~/.config/aerospace
#   chmod +x ~/.config/aerospace/split-last.sh ~/.config/aerospace/bsp-watch.sh
# Then: aerospace reload-config

config-version = 2
start-at-login = true
auto-reload-config = true

after-login-command = []
after-startup-command = [
    'layout v_accordion',
    ## 'exec-and-forget $HOME/.config/aerospace/bsp-watch.sh',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 7
default-root-container-layout = 'accordion'
default-root-container-orientation = 'vertical'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = []
on-mode-changed = []

automatically-unhide-macos-hidden-apps = true
focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

persistent-workspaces = ['1']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = [{ monitor."built-in" = 3 }, 36]
outer.right = 8

[[on-window-detected]]
check-further-callbacks = true
run = 'layout tiling'

[mode.main.binding]
    cmd-h = []
    cmd-alt-h = []

    alt-enter = 'exec-and-forget kitty @ launch --type=os-window --cwd=current'
    alt-shift-enter = 'exec-and-forget open -a "Zen"'
    alt-space = 'exec-and-forget open -a Raycast'

    alt-shift-f = 'exec-and-forget open -a Finder'
    alt-shift-b = 'exec-and-forget open -a "Zen"'

    alt-w = 'close'
    alt-f = 'fullscreen'
    alt-s = 'exec-and-forget $HOME/.config/aerospace/omarchy-j.sh'
    alt-slash = 'layout tiles --root'
    alt-a = 'layout v_accordion --root'

    alt-h = 'exec-and-forget $HOME/.config/aerospace/smart-focus.sh left --boundaries all-monitors-outer-frame'
    alt-j = 'exec-and-forget $HOME/.config/aerospace/smart-focus.sh down --wrap-around'
    alt-k = 'exec-and-forget $HOME/.config/aerospace/smart-focus.sh up --wrap-around'
    alt-l = 'exec-and-forget $HOME/.config/aerospace/smart-focus.sh right --boundaries all-monitors-outer-frame'

    alt-shift-h  = 'move left --boundaries all-monitors-outer-frame'
    alt-shift-j  = 'move down --boundaries all-monitors-outer-frame'
    alt-shift-k    = 'move up --boundaries all-monitors-outer-frame'
    alt-shift-l = 'move right --boundaries all-monitors-outer-frame'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-tab       = 'focus-monitor --wrap-around next'
    alt-shift-tab = 'move-node-to-monitor --wrap-around --focus-follows-window next'

    alt-esc = 'exec-and-forget pmset displaysleepnow'
    alt-shift-c = 'reload-config'

    alt-r = 'mode resize'
    alt-shift-semicolon = 'mode service'
    alt-shift-r = ['flatten-workspace-tree', 'layout tiles --root']
    alt-t = 'layout floating tiling'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    left  = 'resize width -50'
    down  = 'resize height +50'
    up    = 'resize height -50'
    right = 'resize width +50'
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    enter = 'mode main'
    esc   = 'mode main'

[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'layout tiles --root', 'mode main']
    t         = ['layout tiles --root', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']
    alt-shift-left = ['join-with left', 'mode main']
    alt-shift-right = ['join-with right', 'mode main']
    alt-shift-down = ['join-with down', 'mode main']
    alt-shift-up = ['join-with up', 'mode main']

# Mail's zoeksuggesties zijn een los venster zonder titel; laat dat zweven
[[on-window-detected]]
if.app-id = 'com.apple.mail'
if.window-title-regex-substring = '^(Naamloos|Untitled)?$'
run = 'layout floating'
check-further-callbacks = false

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id =  'com.1password.1password'
run = ['layout floating']

[[on-window-detected]]
if.app-id =  'me.proton.pass.electron'
run = ['layout floating']

[[on-window-detected]]
